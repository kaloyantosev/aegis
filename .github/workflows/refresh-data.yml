name: Refresh price data

# Weekly, after the US market close on Friday (UTC Saturday morning).
on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas
      - run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet public/data/prices.json; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          git commit -m "data: prices to $(python -c "import json;print(json.load(open('public/data/prices.json'))['asOf'])")"
          git push
